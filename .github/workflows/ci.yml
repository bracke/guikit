name: ci

# Builds guikit and runs its AUnit suite on Linux, macOS and Windows.
#
# It was Linux-only, and that hid a real fault: the test binary asked for "-lvulkan"
# on every platform, while the Vulkan loader on Windows is vulkan-1.dll. guikit's own
# tests could not have been built there at all, and nothing said so. A matrix is what
# keeps the linker switches honest.
#
# PREREQUISITE: guikit pins textrender by local path in alire.toml, so it must exist
# as a sibling checkout or the manifest will not load.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 macOS job, on the pinned toolchain.
        # macos-latest is Apple silicon: gnat_native=15.2.1 ships no
        # aarch64-darwin binary, so that one job builds with 15.3.1 and
        # rewrites the =15.2.1 pins in its own checkout to match, as files'
        # CI does. Every manifest stays on 15.2.1.
        os: [ubuntu-latest, macos-15-intel, windows-latest, macos-latest]
        include:
          - toolchain: gnat_native=15.2.1
          - os: macos-latest
            toolchain: gnat_native=15.3.1

    steps:
      - name: Check out guikit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: guikit

      # guikit pins textrender at ../textrender, so it must exist as a sibling
      # checkout or the manifest will not load.
      - name: Clone sibling crates at pinned revisions
        # Pinned, as files' CI pins them, so a run can be repeated: the
        # siblings' main moves. Bump a pin together with the change that
        # needs it; the list is guikit's alire.toml pin closure.
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          owner="${{ github.repository_owner }}"
          clone_at() {
            git init "$1"
            git -C "$1" remote add origin "https://github.com/${owner}/$1.git"
            git -C "$1" fetch --depth 1 origin "$2"
            git -C "$1" checkout --detach FETCH_HEAD
          }
          clone_at textrender 0a6721cb4239e581518c0d312bb7085e5b1ff402
          clone_at project_tools 5ed5f4dcfa10301345933d45e5f78ac0573d8cff

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # openglada_glfw's Linker_Options require the X11 libraries below; without
          # them everything compiles and the link then fails on -lXxf86vm.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            mesa-vulkan-drivers \
            fonts-dejavu-core \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev
          sudo apt-get install -y libaunit-dev \
            || sudo apt-get install -y libaunit22-dev \
            || sudo apt-get install -y libaunit24-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use the runner image's coherent Homebrew snapshot, as files does. A
          # brew update moved gdk-pixbuf onto openssl@4, which has no Intel bottle,
          # and building it from source ran past the job timeout.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # The Intel image can keep a dangling openssl@1.1 link that makes an
          # otherwise successful openssl upgrade report failure.
          brew unlink openssl@1.1 || true
          if [ -L /usr/local/bin/openssl ] &&
             [[ "$(readlink /usr/local/bin/openssl)" == *openssl@1.1* ]]; then
            unlink /usr/local/bin/openssl
          fi
          # MoltenVK provides the Vulkan loader/ICD on macOS; gdk-pixbuf pulls in
          # glib, which the test binary's linker switches name.
          brew install vulkan-headers vulkan-loader molten-vk glfw gdk-pixbuf

          # Homebrew on the x86_64 runner installs under /usr/local, which is not on
          # the linker's default search path.
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its `ld` needs mingw
          # import libraries (libvulkan-1.dll.a). The chocolatey vulkan-sdk ships MSVC
          # .lib files, which that linker cannot use -- take every library from the
          # MSYS2 installation preinstalled on the runner instead.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }

          # The runner's MSYS2 keyring goes stale, and then the database refuses to
          # sync at all: "signature ... is invalid". Refresh it first, as files'
          # and hostkit's CI do; a sync that still will not verify fails the job.
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-glib2
                    mingw-w64-x86_64-gdk-pixbuf2
                    mingw-w64-x86_64-glfw"

          # The mirrors stall often enough to matter -- a sync dies on "less than 1
          # bytes/sec" rather than on anything we did -- so give each sync room to be
          # slow, and retry it before concluding anything is actually wrong.
          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          #  No unsigned fallback: a sync that cannot be verified fails the
          #  job rather than installing packages nobody checked.
          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }

          # ld resolves -l<name> through LIBRARY_PATH; the DLLs must also be on PATH
          # for the test binary to start.
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Set up Alire
        # Pin the toolchain the manifests require. setup-alire@v5 defaults to alr
        # 2.1.0, whose index carries gnat_native 15.2.1; v4 pins alr 2.0.2, whose
        # older index cannot resolve it.
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          toolchain: ${{ matrix.toolchain }} gprbuild

      - name: Pin the Apple silicon toolchain in this checkout (macos-latest)
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          find . -name alire.toml -not -path "*/alire/*" -print0 |
            xargs -0 grep -l 'gnat_native = "=15.2.1"' |
            while read -r manifest; do
              sed -i '' 's/gnat_native = "=15.2.1"/gnat_native = "=15.3.1"/' "$manifest"
              echo "pinned 15.3.1 in $manifest"
            done
          # The Command Line Tools SDK names architectures the selected
          # Xcode's ld does not know; that Xcode's own SDK matches its ld.
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        shell: bash
        working-directory: guikit
        run: |
          set -o pipefail
          #  A clean build says nothing: `alr build` exits 0 with warnings and
          #  style complaints on its output, so they are refused here, as
          #  hostkit's CI does. Only this crate's own units (guikit-*, glfw-*):
          #  what a path dependency says about its sources belongs to its own
          #  repository.
          alr --non-interactive build 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build-output.txt"
          pattern="^(guikit|glfw)[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: "
          if grep -Eq "$pattern" "${RUNNER_TEMP:-/tmp}/build-output.txt"; then
            echo "The build said something. A clean build says nothing:"
            grep -E "$pattern" "${RUNNER_TEMP:-/tmp}/build-output.txt"
            exit 1
          fi

      - name: Build and run the test suite
        # Well inside the job's own limit: a hung suite fails here, by name.
        timeout-minutes: 20
        shell: bash
        working-directory: guikit/tests
        env:
          # A test that needs a font fails rather than skips where one is
          # certain: fonts-dejavu-core is installed above on Linux, and Windows
          # ships Consolas. The macOS images guarantee no .ttf face the tests
          # look for, so a skip there is reported, not failed.
          GUIKIT_TEST_REQUIRE_FONT: ${{ (runner.os == 'Linux' || runner.os == 'Windows') && '1' || '0' }}
        run: |
          alr --non-interactive build
          # The binary is guikit_tests.exe on Windows, and bash will not find it under
          # the Unix name.
          if [ -f ./bin/guikit_tests.exe ]; then
            # A missing DLL makes Windows refuse to start the process, and bash
            # reports that as a plain "not found" (exit 127), with no hint as to which
            # library is absent. Name any unresolved import, so a load failure says
            # what it is.
            export PATH="/c/msys64/mingw64/bin:$PATH"
            if ldd ./bin/guikit_tests.exe | grep -i 'not found'; then
              echo "::error::the test binary has unresolved DLL imports (listed above)"
              exit 1
            fi
            ./bin/guikit_tests.exe
          else
            ./bin/guikit_tests
          fi

      - name: Project checks (check_all)
        # Layering, GNATdoc, whitespace and test registration: the lints the
        # project holds itself to, which nothing else in CI runs. Once, on
        # Linux: they read sources, not per-host behaviour.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: guikit
        run: |
          (cd tools && alr --non-interactive build)
          tools/bin/check_all
